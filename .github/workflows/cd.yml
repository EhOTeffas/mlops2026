name: CD - Deploy Container App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Docker para deploy / rollback (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  call-ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: call-ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Definir Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy no Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: mlops-2026-2
          containerAppName: intent-clf
          imageToDeploy: ghcr.io/ehoteffas/mlops2026:${{ env.IMAGE_TAG }}

      - name: Health Check
        run: |
          echo "Aguardando inicialização..."
          sleep 15
          RESPONSE=$(curl -s ${{ vars.APP_URL }}/)
          echo "Resposta: $RESPONSE"
          if [[ "$RESPONSE" != *"v1.0"* && "$RESPONSE" != *"ok"* ]]; then
            echo "Health check falhou!"
            exit 1
          fi